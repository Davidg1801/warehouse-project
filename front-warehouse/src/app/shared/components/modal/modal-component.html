<dialog #dialogElement (cancel)="close()">
  <div
    class="modal-container"
    [class]="'modal-' + (modalService.config().variant || 'info')"
    data-testid="modal-container"
  >
    <div class="modal-header">
      <h3 class="modal-title" data-testid="modal-title">{{ modalService.config().title }}</h3>
    </div>

    <div class="modal-body">
      <p class="modal-text" data-testid="modal-text">{{ modalService.config().message }}</p>
    </div>

    <div class="modal-footer">
      @if (modalService.config().cancelLabel !== '') {
        <button class="btn cancel-btn" data-testid="modal-cancel-btn" (click)="close()">
          {{ modalService.config().cancelLabel || 'Cancel' }}
        </button>
      }
      <button class="btn confirm-btn" data-testid="modal-confirm-btn" (click)="confirm()">
        {{ modalService.config().confirmLabel || 'OK' }}
      </button>
    </div>
  </div>
</dialog>
