<div class="app-layout">
  <header class="app-header">
    <div class="app-title">Warehouse Inventory System</div>

    <div class="app-user">
      @if (username()) {
        <div class="user-info">
          <div class="username" data-testid="username-field">
            Logged in: <strong>{{ username() }}</strong>
          </div>
          @if (isAdmin()) {
            <div class="user-role">Admin</div>
          }
        </div>
      }

      <button class="logout-btn" data-testid="logout-btn" (click)="logout()">Logout</button>
    </div>
  </header>

  <div class="app-body">
    <aside class="app-sidebar">
      <nav class="sidebar-nav">
        <a routerLink="/products" routerLinkActive="active" class="nav-item">
          <span class="nav-label">Products</span>
        </a>
        <a routerLink="/orders" routerLinkActive="active" class="nav-item">
          <span class="nav-label">Orders</span>
        </a>
      </nav>
    </aside>

    <main class="app-content">
      <router-outlet></router-outlet>
    </main>
  </div>
  <app-modal-component></app-modal-component>
</div>
