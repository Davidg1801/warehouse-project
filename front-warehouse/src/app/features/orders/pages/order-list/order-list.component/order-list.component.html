<div class="orders-page">
  <header class="page-header">
    <div class="header-info">
      <h1 class="page-title">Orders</h1>
      <p class="page-subtitle">Filter, browse and view details for every order</p>
    </div>

    <div class="header-actions">
      <button class="add-btn" type="button" [routerLink]="['/orders/create']">
        ✚ Create Order
      </button>
    </div>
  </header>

  <div class="page-body">
    <main class="orders-content">
      <!-- FILTERS -->
      <app-order-filters
        [initialFilters]="activeFilters()"
        (filtersChange)="onFiltersChange($event)"
      />

      <!-- ORDER TABLE -->
      <div class="table-container" [class.is-loading]="ordersResource.isLoading()">
        <app-order-table
          [orders]="orders()"
          [currentSort]="sortState()"
          (orderSelected)="selectOrder($event)"
          (sortChange)="onSortChange($event)"
        />
      </div>

      <!-- PAGINATION -->
      <app-pagination
        [currentPage]="pageNumber()"
        [totalPages]="totalPages()"
        [totalCount]="totalCount()"
        [pageSize]="pageSize()"
        (pageChange)="onPageChanged($event)"
        (pageSizeChange)="onPageSizeChanged($event)"
      />
    </main>

    <!-- ORDER DETAILS -->
    @if (selectedOrder(); as activeOrder) {
      <aside class="order-details-sidebar">
        <app-order-details [selectedOrder]="activeOrder" (closeOrderDetails)="closeDetails()" />
      </aside>
    }
  </div>
</div>
