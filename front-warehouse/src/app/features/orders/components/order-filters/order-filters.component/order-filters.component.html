<section class="filters-card">
  <form [formGroup]="filterForm" class="filters-form">
    <div class="filters-grid">
      <!-- Date From -->
      <div class="filter-group">
        <label for="dateFrom">Date From</label>
        <input
          id="dateFrom"
          type="date"
          class="form-control"
          [class.has-value]="!!filterForm.controls.dateFrom.value"
          formControlName="dateFrom"
        />
      </div>

      <!-- Date To -->
      <div class="filter-group">
        <label for="dateTo">Date To</label>
        <input
          id="dateTo"
          type="date"
          class="form-control"
          [class.has-value]="!!filterForm.controls.dateTo.value"
          formControlName="dateTo"
        />
      </div>

      <!-- Order ID -->
      <div class="filter-group">
        <label for="orderId">Order ID</label>
        <input
          id="orderId"
          type="text"
          placeholder="Search by order id..."
          class="form-control"
          formControlName="orderId"
        />
      </div>

      <!-- Customer Search -->
      <div class="filter-group">
        <label for="customer">Customer</label>
        <input
          id="customer"
          type="text"
          placeholder="Search by customer..."
          class="form-control"
          formControlName="customerId"
        />
      </div>

      <!-- Product Filter -->
      <div class="filter-group">
        <label for="product">Contains Product</label>
        <input
          id="product"
          type="text"
          placeholder="Product name..."
          class="form-control"
          formControlName="productName"
        />
      </div>
    </div>
    @if (filterForm.hasError('dateRangeInvalid')) {
      <span class="error-message">Date From cannot be later than Date To</span>
    }
  </form>
</section>
