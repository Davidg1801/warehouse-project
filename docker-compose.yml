version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: warehouse-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: warehouse-redis
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    ports:
      - "6379:6379"
    restart: unless-stopped

  valkey:
    image: valkey/valkey:alpine
    container_name: warehouse-valkey
    command: valkey-server --requirepass "${VALKEY_PASSWORD}"
    ports:
      - "6380:6379"
    restart: unless-stopped

  nats:
    image: nats:alpine
    container_name: warehouse-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "-m 8222"

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: warehouse-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_URL: http://localhost/auth/
      KC_HOSTNAME_ADMIN_URL: http://localhost/auth/
    command: start-dev
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./warehouse-theme:/opt/keycloak/themes/warehouse-theme

  nginx:
    image: nginx:alpine
    container_name: warehouse-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - bff
      - keycloak

  # --- Main services
  bff:
    build:
      context: ./back-warehouse-bff
      dockerfile: Dockerfile
    container_name: warehouse-bff
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Nats__Url=nats://nats:4222
      - Valkey__Configuration=valkey:6379,password=${VALKEY_PASSWORD}
    volumes:
      - ./back-warehouse-bff:/app
    depends_on:
      - keycloak
      - nats
      - valkey

  product-mgmt:
    build:
      context: ./back-product-mgmt
      dockerfile: Dockerfile
    container_name: warehouse-product-mgmt
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - Nats__Url=nats://nats:4222
      - Redis__Configuration=redis:6379,password=${REDIS_PASSWORD}
    volumes:
      - ./back-product-mgmt:/app
    depends_on:
      - postgres
      - nats

  order-mgmt:
    build:
      context: ./back-order-mgmt
      dockerfile: Dockerfile
    container_name: warehouse-order-mgmt
    environment:
      - NODE_ENV=development
      - NATS_URL=nats://nats:4222
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    volumes:
      - ./back-order-mgmt:/app
      - /app/node_modules
    depends_on:
      - postgres
      - nats

  frontend:
    build:
      context: ./front-warehouse
      dockerfile: Dockerfile
    container_name: warehouse-frontend
    ports:
      - "4200:4200"
    volumes:
      - ./front-warehouse:/app
      - /app/node_modules
    depends_on:
      - bff

volumes:
  postgres_data:
  keycloak_data:
